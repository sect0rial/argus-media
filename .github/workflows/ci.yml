# npx runs mcp/dist exactly as committed. This workflow rebuilds it from mcp/src with the locked toolchain and
# fails if the committed files are not that build, so what runs is what the source says.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: mcp/dist must equal a fresh build of mcp/src
        run: |
          if [ -n "$(git status --porcelain -- mcp/dist)" ]; then
            git status --porcelain -- mcp/dist
            git diff -- mcp/dist
            echo "::error::mcp/dist differs from a build of mcp/src. Run npm run build and commit mcp/dist."
            exit 1
          fi
      - run: npm test
      - run: npm audit --audit-level=high
